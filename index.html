<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3-Ring Interlocking Puzzle</title>
  <style>
    body {
      background-color: #1e1e2e;
      color: #cdd6f4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    /* Top-Left Language Switcher Button */
    .lang-switch-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: #313244;
      color: #cdd6f4;
      border: 1px solid #585b70;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      z-index: 10;
      transition: all 0.2s ease;
    }
    .lang-switch-btn:hover {
      background-color: #45475a;
      border-color: #89b4fa;
      color: #89b4fa;
    }

    /* Tiled Background Watermarks */
    .bg-watermark-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(6, 1fr);
      pointer-events: none;
      z-index: 0;
      opacity: 0.12;
      padding: 20px;
      box-sizing: border-box;
    }

    .bg-watermark-item {
      font-size: 16px;
      font-weight: bold;
      color: #cdd6f4;
      transform: rotate(-25deg);
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      user-select: none;
    }

    h2, p, .game-container, .btn-container {
      position: relative;
      z-index: 1;
    }

    h2 { margin-bottom: 4px; font-size: 24px; text-align: center; }
    p { margin-top: 0; margin-bottom: 15px; color: #a6adc8; font-size: 14px; text-align: center; }
    
    .game-container {
      position: relative;
      background-color: #181825;
      border: 2px solid #45475a;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      cursor: pointer;
      display: block;
    }

    .btn-container {
      margin-top: 15px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button.game-btn {
      background-color: #313244;
      color: #cdd6f4;
      border: 1px solid #585b70;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    button.game-btn:hover {
      background-color: #45475a;
      border-color: #89b4fa;
    }

    #winMessage {
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      color: #a6e3a1;
      height: 24px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Language Switcher Button (Top Left) -->
  <button class="lang-switch-btn" id="langBtn" onclick="toggleLanguage()">中文</button>

  <!-- Background Watermark Pattern Layer -->
  <div class="bg-watermark-grid" id="bgWatermarkGrid"></div>

  <h2 id="txtTitle">3-Ring Interlocking Puzzle</h2>
  <p id="txtInstruction">Click any ring area or use the buttons below to rotate counterclockwise.</p>

  <div class="game-container">
    <canvas id="puzzleCanvas" width="600" height="470"></canvas>
    <div id="winMessage"></div>
  </div>

  <div class="btn-container">
    <button class="game-btn" id="btnRotate1" onclick="rotateRing(0)">Rotate Ring 1</button>
    <button class="game-btn" id="btnRotate2" onclick="rotateRing(1)">Rotate Ring 2</button>
    <button class="game-btn" id="btnRotate3" onclick="rotateRing(2)">Rotate Ring 3</button>
    <button class="game-btn" id="btnScramble" onclick="scramblePuzzle()">Scramble</button>
  </div>

  <script>
    // Language State ('en' or 'zh')
    let currentLang = 'en';

    const translations = {
      en: {
        langBtn: "中文",
        title: "3-Ring Interlocking Puzzle",
        instruction: "Click any ring area or use the buttons below to rotate counterclockwise.",
        targetGoal: "TARGET GOAL",
        ring1: "RING 1",
        ring2: "RING 2",
        ring3: "RING 3",
        rot1: "Rotate Ring 1",
        rot2: "Rotate Ring 2",
        rot3: "Rotate Ring 3",
        scramble: "Scramble",
        win: "You've successfully completed the puzzle!"
      },
      zh: {
        langBtn: "Eng",
        title: "三環相扣拼圖",
        instruction: "點擊任意環區域或使用下方按鈕進行逆時針旋轉。",
        targetGoal: "目標完成狀態",
        ring1: "第一環",
        ring2: "第二環",
        ring3: "第三環",
        rot1: "旋轉第一環",
        rot2: "旋轉第二環",
        rot3: "旋轉第三環",
        scramble: "打亂重置",
        win: "恭喜你成功完成拼圖！"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'zh' : 'en';
      document.getElementById('langBtn').textContent = translations[currentLang].langBtn;
      document.getElementById('txtTitle').textContent = translations[currentLang].title;
      document.getElementById('txtInstruction').textContent = translations[currentLang].instruction;
      document.getElementById('btnRotate1').textContent = translations[currentLang].rot1;
      document.getElementById('btnRotate2').textContent = translations[currentLang].rot2;
      document.getElementById('btnRotate3').textContent = translations[currentLang].rot3;
      document.getElementById('btnScramble').textContent = translations[currentLang].scramble;
      draw();
    }

    // Dynamically generate the repeated background watermarks
    const gridContainer = document.getElementById('bgWatermarkGrid');
    const handles = ["@myturtlesgame2", "@crazy_calculus"];
    for (let i = 0; i < 24; i++) {
      const div = document.createElement('div');
      div.className = 'bg-watermark-item';
      div.textContent = handles[i % handles.length];
      gridContainer.appendChild(div);
    }

    const canvas = document.getElementById('puzzleCanvas');
    const ctx = canvas.getContext('2d');

    const GOAL_STATE = [
      ['G', 'R', 'G', 'R', 'G'], // Ring 1
      ['R', 'B', 'R', 'B', 'R'], // Ring 2
      ['B', 'G', 'B', 'G', 'B']  // Ring 3
    ];

    let ring = JSON.parse(JSON.stringify(GOAL_STATE));

    const C1 = { x: 300, y: 140, key: "ring1" };
    const C2 = { x: 385, y: 265, key: "ring2" };
    const C3 = { x: 215, y: 265, key: "ring3" };
    const R = 110;
    const boardCenter = { x: 300, y: 223 };

    const colorMap = {
      'G': '#2ecc71',
      'R': '#e74c3c',
      'B': '#3498db'
    };

    function getIntersections(p1, p2, r) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      const a = d / 2;
      const h = Math.sqrt(r * r - a * a);
      const mx = (p1.x + p2.x) / 2;
      const my = (p1.y + p2.y) / 2;

      const pA = { x: mx + (h * dy) / d, y: my - (h * dx) / d };
      const pB = { x: mx - (h * dy) / d, y: my + (h * dx) / d };

      const distA = Math.hypot(pA.x - boardCenter.x, pA.y - boardCenter.y);
      const distB = Math.hypot(pB.x - boardCenter.x, pB.y - boardCenter.y);

      return distA < distB ? { inner: pA, outer: pB } : { inner: pB, outer: pA };
    }

    function checkWin() {
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 5; j++) {
          if (ring[i][j] !== GOAL_STATE[i][j]) return false;
        }
      }
      return true;
    }

    function drawThumbnail() {
      ctx.save();
      
      // Text placed cleanly ABOVE the thumbnail box
      ctx.fillStyle = '#cdd6f4';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(translations[currentLang].targetGoal, 510, 26);

      // Thumbnail box shifted down to make space
      ctx.fillStyle = '#1e1e2e';
      ctx.strokeStyle = '#585b70';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(435, 36, 150, 115, 8);
      ctx.fill();
      ctx.stroke();

      const tc1 = { x: 510, y: 76 };
      const tc2 = { x: 533, y: 109 };
      const tc3 = { x: 487, y: 109 };
      const tR = 30;

      [tc1, tc2, tc3].forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, tR, 0, Math.PI * 2);
        ctx.strokeStyle = '#585b70';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      const tint13 = getIntersections(tc1, tc3, tR);
      const tint12 = getIntersections(tc1, tc2, tR);
      const tint23 = getIntersections(tc2, tc3, tR);

      const tNodes = [
        { x: tc1.x, y: tc1.y - tR, val: GOAL_STATE[0][4] },
        { x: tc2.x + tR * 0.88, y: tc2.y + tR * 0.48, val: GOAL_STATE[1][4] },
        { x: tc3.x - tR * 0.88, y: tc3.y + tR * 0.48, val: GOAL_STATE[2][4] },
        { x: tint13.outer.x, y: tint13.outer.y, val: GOAL_STATE[0][0] },
        { x: tint13.inner.x, y: tint13.inner.y, val: GOAL_STATE[0][2] },
        { x: tint12.outer.x, y: tint12.outer.y, val: GOAL_STATE[0][3] },
        { x: tint12.inner.x, y: tint12.inner.y, val: GOAL_STATE[0][1] },
        { x: tint23.outer.x, y: tint23.outer.y, val: GOAL_STATE[1][3] },
        { x: tint23.inner.x, y: tint23.inner.y, val: GOAL_STATE[1][1] }
      ];

      tNodes.forEach(node => {
        ctx.beginPath();
        ctx.arc(node.x, node.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = colorMap[node.val];
        ctx.fill();
        ctx.strokeStyle = '#11111b';
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centers = [C1, C2, C3];
      centers.forEach((c) => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, R, 0, Math.PI * 2);
        ctx.strokeStyle = '#585b70';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#a6adc8';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(translations[currentLang][c.key], c.x, c.y + (c === C1 ? -32 : 40));
      });

      const int13 = getIntersections(C1, C3, R);
      const int12 = getIntersections(C1, C2, R);
      const int23 = getIntersections(C2, C3, R);

      const nodes = [
        { x: C1.x, y: C1.y - R, val: ring[0][4] },
        { x: C2.x + R * 0.88, y: C2.y + R * 0.48, val: ring[1][4] },
        { x: C3.x - R * 0.88, y: C3.y + R * 0.48, val: ring[2][4] },
        { x: int13.outer.x, y: int13.outer.y, val: ring[0][0] },
        { x: int13.inner.x, y: int13.inner.y, val: ring[0][2] },
        { x: int12.outer.x, y: int12.outer.y, val: ring[0][3] },
        { x: int12.inner.x, y: int12.inner.y, val: ring[0][1] },
        { x: int23.outer.x, y: int23.outer.y, val: ring[1][3] },
        { x: int23.inner.x, y: int23.inner.y, val: ring[1][1] }
      ];

      nodes.forEach(node => {
        ctx.beginPath();
        ctx.arc(node.x, node.y, 16, 0, Math.PI * 2);
        ctx.fillStyle = colorMap[node.val];
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#11111b';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(node.val, node.x, node.y);
      });

      drawThumbnail();

      ctx.fillStyle = '#6c7086';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText("Created by 5A 25 Ian, 21/9/2026", 15, canvas.height - 10);

      const winDiv = document.getElementById('winMessage');
      if (checkWin()) {
        winDiv.textContent = translations[currentLang].win;
      } else {
        winDiv.textContent = "";
      }
    }

    function rotateRing(ringIdx) {
      let b = ring[ringIdx][4];
      for (let k = 0; k < 4; k++) {
        ring[ringIdx][4 - k] = ring[ringIdx][3 - k];
      }
      ring[ringIdx][0] = b;

      if (ringIdx === 0) {
        ring[1][0] = ring[0][3];
        ring[1][2] = ring[0][1];
        ring[2][1] = ring[0][2];
        ring[2][3] = ring[0][0];
      } else if (ringIdx === 1) {
        ring[2][0] = ring[1][3];
        ring[2][2] = ring[1][1];
        ring[0][1] = ring[1][2];
        ring[0][3] = ring[1][0];
      } else if (ringIdx === 2) {
        ring[0][0] = ring[2][3];
        ring[0][2] = ring[2][1];
        ring[1][1] = ring[2][2];
        ring[1][3] = ring[2][0];
      }

      draw();
    }

    function scramblePuzzle() {
      ring = JSON.parse(JSON.stringify(GOAL_STATE));
      for (let i = 0; i < 25; i++) {
        let rIdx = Math.floor(Math.random() * 3);
        let b = ring[rIdx][4];
        for (let k = 0; k < 4; k++) {
          ring[rIdx][4 - k] = ring[rIdx][3 - k];
        }
        ring[rIdx][0] = b;

        if (rIdx === 0) {
          ring[1][0] = ring[0][3]; ring[1][2] = ring[0][1]; ring[2][1] = ring[0][2]; ring[2][3] = ring[0][0];
        } else if (rIdx === 1) {
          ring[2][0] = ring[1][3]; ring[2][2] = ring[1][1]; ring[0][1] = ring[1][2]; ring[0][3] = ring[1][0];
        } else if (rIdx === 2) {
          ring[0][0] = ring[2][3]; ring[0][2] = ring[2][1]; ring[1][1] = ring[2][2]; ring[1][3] = ring[2][0];
        }
      }
      draw();
    }

    canvas.addEventListener('click', function(event) {
      const rect = canvas.getBoundingClientRect();
      const mouseX = event.clientX - rect.left;
      const mouseY = event.clientY - rect.top;

      const centers = [C1, C2, C3];
      for (let i = 0; i < centers.length; i++) {
        const dist = Math.hypot(mouseX - centers[i].x, mouseY - centers[i].y);
        if (dist <= R + 15) {
          rotateRing(i);
          break;
        }
      }
    });

    scramblePuzzle();
  </script>
</body>
</html>
